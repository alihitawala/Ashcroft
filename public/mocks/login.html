<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — ashcroft.cloud</title>
    <style>
        [data-theme="dark"] {
            --bg: #0b0e11; --surface: #13171c; --surface2: #1a1f26;
            --border: #2a313a; --text: #f0f2f5; --text-secondary: #8a94a0; --text-tertiary: #5a6370;
            --accent: #635bff; --accent-light: #7a73ff; --accent-bg: rgba(99,91,255,0.1);
        }
        [data-theme="light"] {
            --bg: #f6f8fa; --surface: #ffffff; --surface2: #f0f2f5;
            --border: #e0e4e8; --text: #1a1f36; --text-secondary: #596577; --text-tertiary: #8792a2;
            --accent: #635bff; --accent-light: #7a73ff; --accent-bg: rgba(99,91,255,0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; -webkit-font-smoothing: antialiased; transition: background 0.3s, color 0.3s; }
        .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 40px; width: 100%; max-width: 400px; margin: 20px; box-shadow: 0 4px 24px rgba(0,0,0,0.15); transition: background 0.3s, border-color 0.3s; }
        .logo { text-align: center; font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .logo .dot { color: var(--accent); }
        .subtitle { text-align: center; color: var(--text-tertiary); font-size: 14px; margin-bottom: 32px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
        .form-group input { width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 14px; outline: none; transition: all 0.2s; }
        .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
        .form-group input::placeholder { color: var(--text-tertiary); }
        .login-btn { width: 100%; padding: 11px; border-radius: 8px; background: var(--accent); color: white; font-size: 14px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; }
        .login-btn:hover { background: var(--accent-light); }
        .footer { text-align: center; margin-top: 18px; font-size: 11px; color: var(--text-tertiary); }
        .turtle { font-size: 24px; display: block; text-align: center; margin-bottom: 16px; }
        .back { display: inline-block; padding: 6px 14px; margin-bottom: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text-secondary); text-decoration: none; font-size: 12px; }
        .back:hover { color: var(--accent); border-color: var(--accent); }
        .theme-row { display: flex; justify-content: center; margin-bottom: 16px; }
        .theme-toggle { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .theme-toggle:hover { border-color: var(--accent); }
    </style>
</head>
<body>
    <a class="back" href="index.html">← All Mocks</a>
    <div class="login-card">
        <div class="turtle">🐢</div>
        <div class="logo">ashcroft<span class="dot">.</span>cloud</div>
        <div class="subtitle">Welcome back</div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="you@ashcroft.cloud" />
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="••••••••" />
        </div>
        <button class="login-btn">Sign In</button>
        <div class="footer">Private access · Household only</div>
        <div class="theme-row" style="margin-top:16px;"><button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button></div>
    </div>
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('themeBtn');
            if (html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
                btn.textContent = '☀️';
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.textContent = '🌙';
            }
        }
    </script>
</body>
</html>
