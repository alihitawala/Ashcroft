<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Eid Mubarak — You're Invited!</title>
<meta property="og:title" content="Eid Mubarak — You're Invited!">
<meta property="og:description" content="Join us for an unforgettable Eid celebration!">
<meta property="og:image" content="https://ashcroft.cloud/eid/bg.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a1628;
    font-family: 'Cormorant Garamond', Georgia, serif;
  }

  .invite-wrapper {
    position: relative;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
  }

  .invite-bg {
    width: 100%;
    height: auto;
    display: block;
  }

  .text-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 18%;
  }

  .details-block {
    text-align: center;
    color: #d4af37;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .details-block .heading {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: clamp(14px, 3.2vw, 22px);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 0.6em;
  }

  .details-block .detail-line {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: clamp(16px, 3.8vw, 26px);
    line-height: 1.7;
    letter-spacing: 1px;
  }

  .rsvp-section {
    margin-top: 1.2em;
  }

  .rsvp-btn {
    display: inline-block;
    padding: 12px 40px;
    background: linear-gradient(135deg, #d4af37, #f5d76e, #d4af37);
    color: #0a2a3f;
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: clamp(14px, 3vw, 20px);
    text-transform: uppercase;
    letter-spacing: 2px;
    text-decoration: none;
    border-radius: 4px;
    border: 1px solid #b8960c;
    box-shadow: 0 2px 12px rgba(212,175,55,0.3);
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
  }

  .rsvp-btn:hover {
    transform: scale(1.03);
    box-shadow: 0 4px 20px rgba(212,175,55,0.5);
  }

  /* Sparkle animation */
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  .sparkle {
    position: absolute;
    width: 4px; height: 4px;
    background: #f5d76e;
    border-radius: 50%;
    animation: twinkle 2s infinite;
    pointer-events: none;
  }

  @media (max-width: 480px) {
    .text-overlay { padding-bottom: 16%; }
    .details-block .detail-line { line-height: 1.6; }
  }
</style>
</head>
<body>

<div class="invite-wrapper">
  <img src="bg.jpg" alt="Eid Mubarak Invitation" class="invite-bg">

  <!-- Sparkles -->
  <div class="sparkle" style="top:25%; left:20%; animation-delay:0s;"></div>
  <div class="sparkle" style="top:30%; left:75%; animation-delay:0.5s;"></div>
  <div class="sparkle" style="top:45%; left:15%; animation-delay:1s;"></div>
  <div class="sparkle" style="top:40%; left:82%; animation-delay:1.5s;"></div>
  <div class="sparkle" style="top:55%; left:30%; animation-delay:0.3s;"></div>
  <div class="sparkle" style="top:50%; left:68%; animation-delay:0.8s;"></div>

  <div class="text-overlay">
    <div class="details-block">
      <div class="heading">Join Us for an Eid Gathering</div>
      <div class="detail-line">Sunday, March 30th, 2026</div>
      <div class="detail-line">4:00 PM Onwards</div>
      <div class="detail-line">1160 Ashcroft Way, Sunnyvale</div>
      <div class="rsvp-section">
        <a href="#rsvp" class="rsvp-btn" onclick="handleRSVP(event)">RSVP Now</a>
      </div>
    </div>
  </div>
</div>

<script>
function handleRSVP(e) {
  e.preventDefault();
  // Placeholder — will wire up to real RSVP system
  alert('RSVP system coming soon!');
}
</script>

</body>
</html>
