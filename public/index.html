<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ashcroft.cloud</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            color: #e0e0e0;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #666;
            letter-spacing: 0.05em;
        }
        .turtle {
            font-size: 2rem;
            margin-top: 1.5rem;
            animation: bounce 2s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <a href="/app/login.html" style="position:fixed;top:16px;right:16px;text-decoration:none;font-size:20px;opacity:0.4;transition:opacity 0.2s;z-index:10;" onmouseover="this.style.opacity=0.8" onmouseout="this.style.opacity=0.4" title="Sign In">🔒</a>
    <div class="container">
        <h1>ashcroft.cloud</h1>
        <p class="subtitle">something is brewing...</p>
        <div class="turtle">🐢</div>
    </div>
</body>
</html>
