# Add these two location blocks to /etc/nginx/sites-enabled/ashcroft.cloud
# BEFORE the "location / {" fallback block.
# Then run: sudo nginx -t && sudo systemctl reload nginx

    # App frontend files
    location /app/ {
        alias /home/ashcroft/www/app/;
        try_files $uri $uri/ =404;
    }

    # API proxy to Express backend
    location /api/ {
        proxy_pass http://127.0.0.1:3456;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
