<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — ashcroft.cloud</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐢</text></svg>">
    <link rel="manifest" href="/app/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#635BFF">
    <link rel="stylesheet" href="/app/css/shared.css?v=1775107407">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            margin: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.15);
            animation: slideUp 0.3s ease;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 4px;
        }
        .login-logo .turtle { font-size: 28px; display: block; margin-bottom: 12px; }
        .login-logo .wordmark { font-size: 18px; font-weight: 700; }
        .login-logo .dot { color: var(--accent); }
        .login-subtitle {
            text-align: center;
            color: var(--text-tertiary);
            font-size: 14px;
            margin-bottom: 28px;
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-tertiary);
        }
        .login-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
        .login-footer a:hover { text-decoration: underline; }

        /* Form styling */
        .login-form .form-group {
            margin-bottom: 18px;
        }
        .login-form .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            letter-spacing: 0.01em;
        }
        .login-form .form-input {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            outline: none;
        }
        .login-form .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-bg);
        }
        .login-form .form-input::placeholder {
            color: var(--text-tertiary);
        }

        /* CTA button */
        .signup-cta {
            width: 100%;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            min-height: 48px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
            margin-top: 8px;
        }
        .signup-cta:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        .signup-cta:active:not(:disabled) {
            transform: translateY(0);
        }
        .signup-cta:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Invite status badges */
        .invite-status {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            animation: slideUp 0.2s ease;
        }
        .invite-status.valid {
            display: flex;
            background: rgba(34,197,94,0.1);
            color: #22c55e;
            border: 1px solid rgba(34,197,94,0.2);
        }
        .invite-status.invalid {
            display: flex;
            background: rgba(239,68,68,0.1);
            color: #ef4444;
            border: 1px solid rgba(239,68,68,0.2);
        }
        .invite-status.loading {
            display: flex;
            color: var(--text-tertiary);
        }

        /* Signup fields reveal */
        .signup-fields {
            display: none;
        }
        .signup-fields.visible {
            display: block;
            animation: slideUp 0.3s ease;
        }

        /* Password hint */
        .password-hint {
            font-size: 12px;
            margin-top: 6px;
            color: var(--text-tertiary);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .password-hint.met {
            color: #22c55e;
        }
        .password-hint.unmet {
            color: var(--text-tertiary);
        }

        /* Divider between invite and fields */
        .signup-divider {
            height: 1px;
            background: var(--border);
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <span class="turtle">🐢</span>
            <span class="wordmark">ashcroft<span class="dot">.</span>cloud</span>
        </div>
        <div class="login-subtitle">Join with an invite code</div>

        <div class="form-error" id="signupError">
            <span>⚠️</span>
            <span id="signupErrorMsg">Something went wrong</span>
        </div>

        <form class="login-form" id="signupForm" autocomplete="on">
            <div class="form-group">
                <label for="inviteCode">Invite Code</label>
                <input class="form-input" id="inviteCode" name="code" type="text"
                       placeholder="Enter your invite code" autocomplete="off" required>
                <div class="invite-status" id="inviteStatus">
                    <span id="inviteStatusIcon"></span>
                    <span id="inviteStatusText"></span>
                </div>
            </div>

            <div class="signup-fields" id="signupFields">
                <div class="signup-divider"></div>

                <div class="form-group">
                    <label for="householdName">Household Name</label>
                    <input class="form-input" id="householdName" name="household_name" type="text"
                           placeholder="e.g. The Smiths" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input class="form-input" id="name" name="name" type="text"
                           placeholder="Your full name" autocomplete="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input class="form-input" id="email" name="email" type="email"
                           placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input class="form-input" id="password" name="password" type="password"
                           placeholder="••••••••" autocomplete="new-password" required minlength="8">
                    <div class="password-hint unmet" id="passwordHint">🔒 At least 8 characters</div>
                </div>

                <button type="submit" class="signup-cta" id="signupBtn" disabled>Create Account</button>
            </div>
        </form>

        <div class="login-footer">
            Already have an account? <a href="/app/login.html">Log in</a>
        </div>
    </div>

    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');</script>
    <script src="/app/js/shared/api.js?v=1775107407"></script>
    <script src="/app/js/shared/auth.js?v=1775107407"></script>
    <script>
        (async () => {
            // If already logged in, go to dashboard
            const user = await checkAuth();
            if (user) {
                window.location.href = '/app/dashboard.html';
                return;
            }

            let codeValid = false;
            let debounceTimer = null;

            const codeInput = document.getElementById('inviteCode');
            const statusEl = document.getElementById('inviteStatus');
            const statusIcon = document.getElementById('inviteStatusIcon');
            const statusText = document.getElementById('inviteStatusText');
            const fields = document.getElementById('signupFields');
            const submitBtn = document.getElementById('signupBtn');
            const errEl = document.getElementById('signupError');
            const errMsg = document.getElementById('signupErrorMsg');
            const passwordInput = document.getElementById('password');
            const passwordHint = document.getElementById('passwordHint');
            const householdInput = document.getElementById('householdName');

            // Password validation hint
            passwordInput.addEventListener('input', () => {
                const len = passwordInput.value.length;
                if (len >= 8) {
                    passwordHint.textContent = '✅ Password length OK';
                    passwordHint.className = 'password-hint met';
                } else if (len > 0) {
                    passwordHint.textContent = `🔒 ${8 - len} more character${8 - len !== 1 ? 's' : ''} needed`;
                    passwordHint.className = 'password-hint unmet';
                } else {
                    passwordHint.textContent = '🔒 At least 8 characters';
                    passwordHint.className = 'password-hint unmet';
                }
                updateSubmitState();
            });

            function updateSubmitState() {
                submitBtn.disabled = !(codeValid && passwordInput.value.length >= 8);
            }

            codeInput.addEventListener('input', () => {
                codeValid = false;
                submitBtn.disabled = true;
                clearTimeout(debounceTimer);
                const code = codeInput.value.trim();
                if (!code) {
                    statusEl.className = 'invite-status';
                    fields.classList.remove('visible');
                    return;
                }
                statusEl.className = 'invite-status loading';
                statusIcon.textContent = '⏳';
                statusText.textContent = 'Checking...';
                debounceTimer = setTimeout(() => validateCode(code), 500);
            });

            async function validateCode(code) {
                try {
                    errEl.classList.remove('visible');
                    const res = await API.get(`/invite/validate/${encodeURIComponent(code)}`);
                    if (!res.valid) {
                        codeValid = false;
                        statusEl.className = 'invite-status invalid';
                        statusIcon.textContent = '✗';
                        statusText.textContent = 'Invalid or expired code';
                        fields.classList.remove('visible');
                        submitBtn.disabled = true;
                        return;
                    }
                    codeValid = true;
                    statusEl.className = 'invite-status valid';
                    statusIcon.textContent = '✓';
                    statusText.textContent = res.household_name
                        ? `Valid — joining ${res.household_name}`
                        : 'Valid invite code';
                    fields.classList.add('visible');
                    // Prefill household name from invite
                    if (res.household_name && !householdInput.value) {
                        householdInput.value = res.household_name;
                    }
                    updateSubmitState();
                } catch (err) {
                    codeValid = false;
                    statusEl.className = 'invite-status invalid';
                    statusIcon.textContent = '✗';
                    statusText.textContent = err.message || 'Invalid or expired code';
                    fields.classList.remove('visible');
                    submitBtn.disabled = true;
                }
            }

            // Auto-validate code from URL param
            const urlCode = new URLSearchParams(window.location.search).get('code');
            if (urlCode) {
                codeInput.value = urlCode;
                validateCode(urlCode);
            }

            document.getElementById('signupForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!codeValid) return;
                if (passwordInput.value.length < 8) {
                    errMsg.textContent = 'Password must be at least 8 characters';
                    errEl.classList.add('visible');
                    return;
                }

                errEl.classList.remove('visible');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner"></span>';

                try {
                    await API.post('/invite/signup', {
                        code: codeInput.value.trim(),
                        name: document.getElementById('name').value.trim(),
                        email: document.getElementById('email').value.trim(),
                        password: passwordInput.value,
                        household_name: householdInput.value.trim(),
                    });
                    window.location.href = '/app/dashboard.html';
                } catch (err) {
                    errMsg.textContent = err.message || 'Signup failed';
                    errEl.classList.add('visible');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create Account';
                }
            });
        })();
    </script>
</body>
</html>
