<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — ashcroft.cloud</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐢</text></svg>">
    <link rel="manifest" href="/app/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#635BFF">
    <link rel="stylesheet" href="/app/css/shared.css?v=1775105850">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            margin: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.15);
            animation: slideUp 0.3s ease;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 4px;
        }
        .login-logo .turtle { font-size: 28px; display: block; margin-bottom: 12px; }
        .login-logo .wordmark { font-size: 18px; font-weight: 700; }
        .login-logo .dot { color: var(--accent); }
        .login-subtitle {
            text-align: center;
            color: var(--text-tertiary);
            font-size: 14px;
            margin-bottom: 28px;
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-tertiary);
        }
        .login-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
        .login-footer a:hover { text-decoration: underline; }
        .login-form .btn-primary {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            min-height: 44px;
        }
        .invite-status {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            margin-top: 6px;
            padding: 8px 12px;
            border-radius: 8px;
            animation: slideUp 0.2s ease;
        }
        .invite-status.valid {
            display: flex;
            background: rgba(34,197,94,0.1);
            color: #22c55e;
            border: 1px solid rgba(34,197,94,0.2);
        }
        .invite-status.invalid {
            display: flex;
            background: rgba(239,68,68,0.1);
            color: #ef4444;
            border: 1px solid rgba(239,68,68,0.2);
        }
        .invite-status.loading {
            display: flex;
            color: var(--text-tertiary);
        }
        .signup-fields {
            display: none;
        }
        .signup-fields.visible {
            display: block;
            animation: slideUp 0.3s ease;
        }
        .signup-fields .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <span class="turtle">🐢</span>
            <span class="wordmark">ashcroft<span class="dot">.</span>cloud</span>
        </div>
        <div class="login-subtitle">Join with an invite code</div>

        <div class="form-error" id="signupError">
            <span>⚠️</span>
            <span id="signupErrorMsg">Something went wrong</span>
        </div>

        <form class="login-form" id="signupForm" autocomplete="on">
            <div class="form-group">
                <label for="inviteCode">Invite Code</label>
                <input class="form-input" id="inviteCode" name="code" type="text"
                       placeholder="Enter your invite code" autocomplete="off" required>
                <div class="invite-status" id="inviteStatus">
                    <span id="inviteStatusIcon"></span>
                    <span id="inviteStatusText"></span>
                </div>
            </div>

            <div class="signup-fields" id="signupFields">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input class="form-input" id="name" name="name" type="text"
                           placeholder="Your name" autocomplete="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input class="form-input" id="email" name="email" type="email"
                           placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input class="form-input" id="password" name="password" type="password"
                           placeholder="••••••••" autocomplete="new-password" required minlength="8">
                </div>
                <button type="submit" class="btn btn-primary" id="signupBtn" disabled>Create Account</button>
            </div>
        </form>

        <div class="login-footer">
            Already have an account? <a href="/app/login.html">Log in</a>
        </div>
    </div>

    <script src="/app/js/shared/api.js?v=1775105850"></script>
    <script src="/app/js/shared/auth.js?v=1775105850"></script>
    <script>
        (async () => {
            // If already logged in, go to dashboard
            const user = await checkAuth();
            if (user) {
                window.location.href = '/app/dashboard.html';
                return;
            }

            let codeValid = false;
            let debounceTimer = null;

            const codeInput = document.getElementById('inviteCode');
            const statusEl = document.getElementById('inviteStatus');
            const statusIcon = document.getElementById('inviteStatusIcon');
            const statusText = document.getElementById('inviteStatusText');
            const fields = document.getElementById('signupFields');
            const submitBtn = document.getElementById('signupBtn');
            const errEl = document.getElementById('signupError');
            const errMsg = document.getElementById('signupErrorMsg');

            codeInput.addEventListener('input', () => {
                codeValid = false;
                submitBtn.disabled = true;
                clearTimeout(debounceTimer);
                const code = codeInput.value.trim();
                if (!code) {
                    statusEl.className = 'invite-status';
                    fields.classList.remove('visible');
                    return;
                }
                statusEl.className = 'invite-status loading';
                statusIcon.textContent = '⏳';
                statusText.textContent = 'Checking...';
                debounceTimer = setTimeout(() => validateCode(code), 500);
            });

            async function validateCode(code) {
                try {
                    errEl.classList.remove('visible');
                    const res = await API.get(`/invite/validate/${encodeURIComponent(code)}`);
                    if (!res.valid) {
                        codeValid = false;
                        statusEl.className = 'invite-status invalid';
                        statusIcon.textContent = '✗';
                        statusText.textContent = 'Invalid or expired code';
                        fields.classList.remove('visible');
                        submitBtn.disabled = true;
                        return;
                    }
                    codeValid = true;
                    statusEl.className = 'invite-status valid';
                    statusIcon.textContent = '✓';
                    statusText.textContent = res.household_name
                        ? `Valid — joining ${res.household_name}`
                        : 'Valid invite code';
                    fields.classList.add('visible');
                    submitBtn.disabled = false;
                } catch (err) {
                    codeValid = false;
                    statusEl.className = 'invite-status invalid';
                    statusIcon.textContent = '✗';
                    statusText.textContent = err.message || 'Invalid or expired code';
                    fields.classList.remove('visible');
                    submitBtn.disabled = true;
                }
            }

            // Auto-validate code from URL param
            const urlCode = new URLSearchParams(window.location.search).get('code');
            if (urlCode) {
                codeInput.value = urlCode;
                validateCode(urlCode);
            }

            document.getElementById('signupForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!codeValid) return;

                errEl.classList.remove('visible');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner"></span>';

                try {
                    await API.post('/invite/signup', {
                        code: codeInput.value.trim(),
                        name: document.getElementById('name').value.trim(),
                        email: document.getElementById('email').value.trim(),
                        password: document.getElementById('password').value,
                    });
                    window.location.href = '/app/dashboard.html';
                } catch (err) {
                    errMsg.textContent = err.message || 'Signup failed';
                    errEl.classList.add('visible');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create Account';
                }
            });
        })();
    </script>
</body>
</html>
