<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>Kanban — ashcroft.cloud</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐢</text></svg>">
    <link rel="manifest" href="/app/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#635BFF">
    <link rel="stylesheet" href="/app/css/shared.css?v=1771820559">
    <style>
    /* ─── Kanban Layout ─── */
    .kanban-header {
        display: flex; align-items: center; gap: 12px;
        padding: 0 0 20px; flex-wrap: wrap;
    }
    .kanban-header h1 {
        font-size: 22px; font-weight: 800; margin: 0;
        display: flex; align-items: center; gap: 10px;
    }
    .kanban-header h1 .header-emoji { font-size: 26px; }
    .kanban-header .header-sub {
        font-size: 13px; color: var(--text-tertiary); font-weight: 400;
        margin-left: 4px;
    }

    .columns-container {
        display: flex; gap: 16px; overflow-x: auto;
        padding-bottom: 16px; align-items: flex-start;
        min-height: calc(100vh - 200px);
        scrollbar-width: thin;
    }
    .columns-container::-webkit-scrollbar { height: 8px; }
    .columns-container::-webkit-scrollbar-track { background: transparent; }
    .columns-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ─── Column ─── */
    .kanban-column {
        min-width: 300px; max-width: 300px; flex-shrink: 0;
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 12px; display: flex; flex-direction: column;
        max-height: calc(100vh - 200px);
    }
    .kanban-column.drag-over { border-color: var(--accent); background: var(--accent-bg); }

    .col-header {
        padding: 14px 14px 10px; display: flex; align-items: center; gap: 8px;
        border-bottom: 1px solid var(--border); position: relative;
    }
    .col-color-strip {
        position: absolute; top: 0; left: 12px; right: 12px;
        height: 3px; border-radius: 0 0 2px 2px;
    }
    .col-name { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; flex: 1; }
    .col-count {
        font-size: 11px; font-weight: 600; background: var(--surface2);
        color: var(--text-tertiary); padding: 1px 7px; border-radius: 10px;
    }
    .col-add-btn, .col-menu-btn {
        width: 32px; height: 32px; border: none; border-radius: 6px;
        background: transparent; color: var(--text-tertiary); cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        font-size: 16px; transition: all 0.15s;
    }
    .col-add-btn:hover, .col-menu-btn:hover { background: var(--surface2); color: var(--accent); }

    .col-menu {
        position: absolute; top: 100%; right: 8px; z-index: 60;
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 8px; box-shadow: var(--shadow-md); min-width: 140px;
        display: none; overflow: hidden;
    }
    .col-menu.visible { display: block; }
    .col-menu button {
        display: block; width: 100%; padding: 9px 14px; border: none;
        background: none; color: var(--text); font-size: 13px;
        text-align: left; cursor: pointer; transition: background 0.15s;
    }
    .col-menu button:hover { background: var(--surface2); }
    .col-menu button.danger { color: var(--red); }
    .col-menu button.danger:hover { background: var(--red-bg); }

    .col-cards {
        flex: 1; overflow-y: auto; padding: 10px;
        display: flex; flex-direction: column; gap: 8px;
        min-height: 60px; scrollbar-width: thin;
    }

    .quick-add { padding: 0 10px 10px; }
    .quick-add input {
        width: 100%; padding: 8px 10px; border-radius: 6px;
        border: 1px solid var(--border); background: var(--surface2);
        color: var(--text); font-size: 16px; outline: none;
    }
    .quick-add input:focus { border-color: var(--accent); }
    .quick-add input::placeholder { color: var(--text-tertiary); }

    /* ─── Card ─── */
    .kanban-card {
        background: var(--surface2); border: 1px solid var(--border);
        border-radius: 8px; padding: 10px 12px; cursor: grab;
        transition: box-shadow 0.15s, transform 0.15s, opacity 0.15s;
        user-select: none;
    }
    .kanban-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .kanban-card.dragging { opacity: 0.4; transform: rotate(2deg); }
    .kanban-card .card-title { font-size: 13px; font-weight: 500; margin-bottom: 6px; word-break: break-word; }
    .kanban-card .card-labels { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .kanban-card .card-labels:empty { display: none; }
    .label-chip {
        font-size: 10px; font-weight: 600; padding: 1px 7px;
        border-radius: 4px; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .kanban-card .card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .kanban-card .card-due {
        font-size: 11px; padding: 1px 6px; border-radius: 4px; font-weight: 500;
    }
    .kanban-card .card-assigned {
        width: 22px; height: 22px; border-radius: 6px;
        color: white; font-size: 10px; font-weight: 700;
        display: flex; align-items: center; justify-content: center;
        margin-left: auto;
    }
    .card-assigned.ali { background: var(--accent); }
    .card-assigned.bittu { background: #10B981; }
    .card-meta:empty { display: none; }

    .drop-placeholder {
        border: 2px dashed var(--accent); border-radius: 8px;
        min-height: 40px; background: var(--accent-bg); transition: all 0.15s;
    }

    .add-column-btn {
        min-width: 300px; max-width: 300px; flex-shrink: 0;
        background: var(--surface); border: 2px dashed var(--border);
        border-radius: 12px; padding: 20px; display: flex;
        align-items: center; justify-content: center; gap: 8px;
        color: var(--text-tertiary); font-size: 13px; font-weight: 500;
        cursor: pointer; transition: all 0.15s; height: fit-content;
    }
    .add-column-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }

    /* ─── Card Detail via createModal ─── */
    .card-detail-body .field-row { margin-bottom: 14px; }
    .card-detail-body .field-label {
        font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
        color: var(--text-tertiary); font-weight: 600; margin-bottom: 4px;
    }
    .card-detail-body .title-input {
        width: 100%; font-size: 18px; font-weight: 700; border: none;
        background: transparent; color: var(--text); outline: none;
        padding: 4px 0; border-bottom: 2px solid transparent;
    }
    .card-detail-body .title-input:focus { border-bottom-color: var(--accent); }
    .labels-picker { display: flex; flex-wrap: wrap; gap: 6px; }
    .labels-picker .label-chip {
        cursor: pointer; opacity: 0.4; transition: opacity 0.15s;
        padding: 3px 10px; font-size: 11px;
    }
    .labels-picker .label-chip.active { opacity: 1; }
    .labels-picker .label-chip:hover { opacity: 0.8; }

    .kanban-page .main-body { max-width: none; padding: 20px 24px; }

    .kanban-loading { display: flex; gap: 16px; padding: 20px 0; }
    .kanban-loading .skeleton-col { min-width: 300px; height: 300px; border-radius: 12px; }

    @media (max-width: 768px) {
        .columns-container { flex-direction: column; overflow-x: visible; gap: 12px; }
        .kanban-column, .add-column-btn { min-width: 100%; max-width: 100%; }
        .kanban-column { max-height: none; }
        .kanban-page .main-body { padding: 14px 12px; }
    }
    </style>
</head>
<body>
    <div class="app-layout kanban-page" id="appLayout"></div>

    <script src="/app/js/shared/api.js?v=1771820559"></script>
    <script src="/app/js/shared/auth.js?v=1771820559"></script>
    <script src="/app/js/shared/ui.js?v=1771820559"></script>
    <script src="/app/js/shared/components.js?v=1771820559"></script>
    <script src="/app/js/shared/nav.js?v=1771820559"></script>
    <script>
    /* ═══════════════════════════════════════════════════════════
       Kanban Board — Ali & Bittu Collaboration Space
       ═══════════════════════════════════════════════════════════ */

    const LABELS = {
        'Website':   { bg: 'rgba(99,91,255,0.2)',  color: '#635BFF' },
        'Home Auto': { bg: 'rgba(16,185,129,0.2)', color: '#10B981' },
        'Infra':     { bg: 'rgba(245,158,11,0.2)', color: '#F59E0B' },
        'Design':    { bg: 'rgba(236,72,153,0.2)', color: '#EC4899' },
        'Bug':       { bg: 'rgba(239,68,68,0.2)',  color: '#EF4444' },
        'Feature':   { bg: 'rgba(59,130,246,0.2)', color: '#3B82F6' },
        'Personal':  { bg: 'rgba(139,92,246,0.2)', color: '#8B5CF6' },
        'Garden':    { bg: 'rgba(34,197,94,0.2)',   color: '#22C55E' },
        'Photo':     { bg: 'rgba(236,72,153,0.2)', color: '#EC4899' },
    };

    const COL_COLORS = {
        'backlog': '#9CA3AF', 'to do': '#3B82F6', 'in progress': '#F59E0B',
        'review': '#8B5CF6', 'done': '#10B981',
    };
    function getColColor(name) {
        const lower = name.toLowerCase();
        for (const [key, color] of Object.entries(COL_COLORS)) {
            if (lower.includes(key)) return color;
        }
        return '#6B7280';
    }

    // Board ID 1 is the permanent "Ali & Bittu" board
    const BOARD_ID = 1;
    let columns = [];
    let cards = [];
    let dragCard = null;

    // ─── Boot ───
    (async () => {
        try { await requireAuth(); } catch { return; }

        // Admin-only page
        if (currentUser.role !== 'admin') {
            document.getElementById('appLayout').innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-tertiary)">Access denied</div>';
            return;
        }

        const shell = renderAppShell('Kanban', 'kanban');
        document.getElementById('appLayout').innerHTML = `
            ${shell.sidebar}
                ${shell.bottomNav}
            <div class="main-content">
                ${shell.topbar}
                <div class="main-body">
                    <div class="kanban-header">
                        <h1><span class="header-emoji">🐢</span> Ali & Bittu <span class="header-sub">— collaboration board</span></h1>
                    </div>
                    <div id="boardContent">
                        <div class="kanban-loading">
                            <div class="skeleton skeleton-col"></div>
                            <div class="skeleton skeleton-col"></div>
                            <div class="skeleton skeleton-col"></div>
                        </div>
                    </div>
                </div>
            </div>`;
        initAppShell('kanban');
        await loadBoard();
    })();

    async function loadBoard() {
        try {
            [columns, cards] = await Promise.all([
                API.get(`/kanban/columns?board_id=${BOARD_ID}`),
                API.get(`/kanban/cards?board_id=${BOARD_ID}`),
            ]);
            columns.sort((a, b) => a.position - b.position);
            renderBoard();
        } catch (e) { showToast(e.message, 'error'); }
    }

    // ─── Rendering ───
    function renderBoard() {
        const container = document.getElementById('boardContent');
        if (!columns.length) {
            container.innerHTML =
                `<div class="empty-state"><div class="emoji"><i data-lucide="kanban"></i></div>
                 <p>Board is empty — add a column to get started!</p>
                 <button class="btn btn-primary" onclick="addColumn()">+ Add Column</button></div>`;
            if (window.lucide) lucide.createIcons();
            return;
        }

        container.innerHTML = `<div class="columns-container" id="columnsContainer">
            ${columns.map(col => renderColumn(col)).join('')}
            <div class="add-column-btn" onclick="addColumn()">+ Add Column</div>
        </div>`;

        document.querySelectorAll('.kanban-column').forEach(setupColumnDnD);
        if (window.lucide) lucide.createIcons();
    }

    function renderColumn(col) {
        const colCards = cards.filter(c => c.column_id === col.id).sort((a, b) => a.position - b.position);
        const color = getColColor(col.name);
        return `
        <div class="kanban-column" data-col-id="${col.id}">
            <div class="col-header">
                <div class="col-color-strip" style="background:${color}"></div>
                <span class="col-name">${esc(col.name)}</span>
                <span class="col-count">${colCards.length}</span>
                <button class="col-add-btn" onclick="quickAddFocus(${col.id})" title="Add card">+</button>
                <button class="col-menu-btn" onclick="toggleColMenu(this, ${col.id})" title="Column options"><i data-lucide="more-horizontal"></i></button>
                <div class="col-menu" id="colMenu${col.id}">
                    <button onclick="renameColumn(${col.id})">Rename</button>
                    <button class="danger" onclick="deleteColumn(${col.id})">Delete Column</button>
                </div>
            </div>
            <div class="quick-add" id="quickAdd${col.id}">
                <input type="text" placeholder="Add a card…" onkeydown="quickAddKey(event, ${col.id})">
            </div>
            <div class="col-cards" data-col-id="${col.id}">
                ${colCards.map(c => renderCard(c)).join('')}
            </div>
        </div>`;
    }

    function getAssignee(card) {
        if (card.assignee_label === 'Bittu') return { name: 'Bittu', cls: 'bittu', letter: '🐢' };
        if (card.assigned_name) return { name: card.assigned_name, cls: 'ali', letter: card.assigned_name[0].toUpperCase() };
        if (card.assigned_to === 1) return { name: 'Ali', cls: 'ali', letter: 'A' };
        return null;
    }

    function renderCard(card) {
        const labelsArr = parseLabels(card.labels);
        const labelsHTML = labelsArr.map(l => {
            const s = LABELS[l] || { bg: 'var(--surface3)', color: 'var(--text-secondary)' };
            return `<span class="label-chip" style="background:${s.bg};color:${s.color}">${esc(l)}</span>`;
        }).join('');

        let dueBadge = '';
        if (card.due_date) {
            const d = new Date(card.due_date);
            const today = new Date(); today.setHours(0,0,0,0);
            const diff = Math.round((d - today) / 86400000);
            let cls = diff <= 0 ? 'due-today' : 'due-normal';
            dueBadge = `<span class="card-due ${cls}"><i data-lucide="calendar" style="width:11px;height:11px;vertical-align:-1px"></i> ${formatDate(card.due_date)}</span>`;
        }

        const assignee = getAssignee(card);
        const assignedBadge = assignee
            ? `<span class="card-assigned ${assignee.cls}" title="${esc(assignee.name)}">${assignee.letter}</span>`
            : '';

        return `
        <div class="kanban-card" draggable="true" data-card-id="${card.id}"
             ondragstart="onDragStart(event)" ondragend="onDragEnd(event)"
             onclick="openCardDetail(${card.id})">
            <div class="card-title">${esc(card.title)}</div>
            <div class="card-labels">${labelsHTML}</div>
            <div class="card-meta">${dueBadge}${assignedBadge}</div>
        </div>`;
    }

    function parseLabels(labels) {
        if (!labels) return [];
        if (Array.isArray(labels)) return labels;
        try { return JSON.parse(labels); } catch { return []; }
    }

    function esc(s) {
        if (!s) return '';
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    // ─── Drag and Drop ───
    function onDragStart(e) {
        dragCard = e.target;
        e.target.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', e.target.dataset.cardId);
    }

    function onDragEnd(e) {
        e.target.classList.remove('dragging');
        document.querySelectorAll('.drop-placeholder').forEach(el => el.remove());
        document.querySelectorAll('.kanban-column.drag-over').forEach(el => el.classList.remove('drag-over'));
        dragCard = null;
    }

    function setupColumnDnD(colEl) {
        const cardsArea = colEl.querySelector('.col-cards');

        cardsArea.addEventListener('dragover', e => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            colEl.classList.add('drag-over');
            const afterCard = getDragAfterElement(cardsArea, e.clientY);
            let placeholder = cardsArea.querySelector('.drop-placeholder');
            if (!placeholder) {
                placeholder = document.createElement('div');
                placeholder.className = 'drop-placeholder';
            }
            if (afterCard) cardsArea.insertBefore(placeholder, afterCard);
            else cardsArea.appendChild(placeholder);
        });

        cardsArea.addEventListener('dragleave', e => {
            if (!cardsArea.contains(e.relatedTarget)) {
                colEl.classList.remove('drag-over');
                cardsArea.querySelector('.drop-placeholder')?.remove();
            }
        });

        cardsArea.addEventListener('drop', async e => {
            e.preventDefault();
            colEl.classList.remove('drag-over');
            const placeholder = cardsArea.querySelector('.drop-placeholder');
            const cardId = e.dataTransfer.getData('text/plain');
            const colId = parseInt(cardsArea.dataset.colId);
            let position = 0;
            if (placeholder) {
                position = [...cardsArea.children].indexOf(placeholder);
                placeholder.remove();
            }
            try {
                await API.put(`/kanban/cards/${cardId}/move`, { column_id: colId, position });
                await loadBoard();
            } catch (err) {
                showToast(err.message, 'error');
                await loadBoard();
            }
        });
    }

    function getDragAfterElement(container, y) {
        const els = [...container.querySelectorAll('.kanban-card:not(.dragging)')];
        let closest = null, closestOffset = Number.POSITIVE_INFINITY;
        for (const el of els) {
            const box = el.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > -closestOffset) {
                closestOffset = -offset;
                closest = el;
            }
        }
        return closest;
    }

    // ─── Quick Add ───
    function quickAddFocus(colId) {
        document.querySelector(`#quickAdd${colId} input`)?.focus();
    }

    async function quickAddKey(e, colId) {
        if (e.key !== 'Enter') return;
        const input = e.target;
        const title = input.value.trim();
        if (!title) return;
        input.disabled = true;
        try {
            const colCards = cards.filter(c => c.column_id === colId);
            await API.post('/kanban/cards', { column_id: colId, title, position: colCards.length });
            input.value = '';
            await loadBoard();
            showToast('Card added ✓');
        } catch (err) { showToast(err.message, 'error'); }
        finally { input.disabled = false; input.focus(); }
    }

    // ─── Card Detail Modal (using createModal) ───
    function openCardDetail(cardId) {
        const card = cards.find(c => c.id === cardId);
        if (!card) return;

        const labelsArr = parseLabels(card.labels);
        const labelsHTML = Object.entries(LABELS).map(([name, s]) =>
            `<span class="label-chip ${labelsArr.includes(name) ? 'active' : ''}"
                  style="background:${s.bg};color:${s.color}"
                  data-label="${esc(name)}" onclick="this.classList.toggle('active')">${esc(name)}</span>`
        ).join('');

        const colOptions = columns.map(c =>
            `<option value="${c.id}" ${c.id === card.column_id ? 'selected' : ''}>${esc(c.name)}</option>`
        ).join('');

        // Determine current assignee selection
        const assigneeVal = card.assignee_label === 'Bittu' ? 'bittu' : (card.assigned_to === 1 ? '1' : '');

        const bodyHTML = `
        <div class="card-detail-body">
            <div class="field-row">
                <input class="title-input" name="title" value="${esc(card.title)}" placeholder="Card title" style="font-size:16px">
            </div>
            <div class="field-row">
                <div class="field-label">Description</div>
                <textarea class="form-input" name="description" rows="3" placeholder="Add a description…" style="font-size:16px">${esc(card.description || '')}</textarea>
            </div>
            <div class="field-row">
                <div class="field-label">Labels</div>
                <div class="labels-picker">${labelsHTML}</div>
            </div>
            <div class="field-row" style="display:flex;gap:12px;">
                <div style="flex:1">
                    <div class="field-label">Due Date</div>
                    <input class="form-input" type="date" name="due_date" value="${card.due_date || ''}" style="font-size:16px">
                </div>
                <div style="flex:1">
                    <div class="field-label">Assigned To</div>
                    <select class="form-input" name="assignee" style="font-size:16px">
                        <option value="">Unassigned</option>
                        <option value="1" ${assigneeVal === '1' ? 'selected' : ''}>👤 Ali</option>
                        <option value="bittu" ${assigneeVal === 'bittu' ? 'selected' : ''}>🐢 Bittu</option>
                    </select>
                </div>
            </div>
            <div class="field-row">
                <div class="field-label">Move to Column</div>
                <select class="form-input" name="move_to" style="font-size:16px">${colOptions}</select>
            </div>
            <div style="padding-top:10px;border-top:1px solid var(--border);margin-top:14px">
                <button class="btn btn-ghost" style="color:var(--red);font-size:13px" onclick="deleteCard(${card.id})">
                    <i data-lucide="trash-2" style="width:14px;height:14px"></i> Delete Card
                </button>
            </div>
        </div>`;

        createModal({
            title: 'Card Details',
            bodyHTML,
            submitLabel: 'Save',
            async onSubmit(modal) {
                const activeLabels = [...modal.querySelectorAll('.label-chip.active')].map(el => el.dataset.label);
                const assigneeSelect = modal.querySelector('[name="assignee"]').value;
                const body = {
                    title: modal.querySelector('[name="title"]').value.trim(),
                    description: modal.querySelector('[name="description"]').value.trim(),
                    labels: activeLabels,
                    due_date: modal.querySelector('[name="due_date"]').value || null,
                    assigned_to: assigneeSelect === '1' ? 1 : null,
                    assignee_label: assigneeSelect === 'bittu' ? 'Bittu' : null,
                };
                if (!body.title) throw new Error('Title is required');
                await API.put(`/kanban/cards/${card.id}`, body);

                const newColId = parseInt(modal.querySelector('[name="move_to"]').value);
                if (newColId !== card.column_id) {
                    await API.put(`/kanban/cards/${card.id}/move`, { column_id: newColId, position: 0 });
                }

                showToast('Card updated ✓');
                await loadBoard();
            },
        });
    }

    async function deleteCard(cardId) {
        if (!confirm('Delete this card?')) return;
        try {
            await API.delete(`/kanban/cards/${cardId}`);
            document.querySelector('.modal-backdrop')?.remove();
            showToast('Card deleted');
            await loadBoard();
        } catch (e) { showToast(e.message, 'error'); }
    }

    // ─── Column CRUD ───
    function toggleColMenu(btn, colId) {
        document.querySelectorAll('.col-menu.visible').forEach(m => m.classList.remove('visible'));
        const menu = document.getElementById(`colMenu${colId}`);
        menu.classList.toggle('visible');
        const handler = e => {
            if (!menu.contains(e.target) && e.target !== btn) {
                menu.classList.remove('visible');
                document.removeEventListener('click', handler);
            }
        };
        setTimeout(() => document.addEventListener('click', handler), 0);
    }

    async function addColumn() {
        const name = prompt('Column name:');
        if (!name?.trim()) return;
        try {
            await API.post('/kanban/columns', { board_id: BOARD_ID, name: name.trim(), position: columns.length });
            showToast('Column added ✓');
            await loadBoard();
        } catch (e) { showToast(e.message, 'error'); }
    }

    async function renameColumn(colId) {
        const col = columns.find(c => c.id === colId);
        const name = prompt('Rename column:', col?.name);
        if (!name?.trim()) return;
        try {
            await API.put(`/kanban/columns/${colId}`, { name: name.trim() });
            showToast('Column renamed ✓');
            await loadBoard();
        } catch (e) { showToast(e.message, 'error'); }
    }

    async function deleteColumn(colId) {
        const col = columns.find(c => c.id === colId);
        if (!confirm(`Delete column "${col?.name}"? All cards in it will be deleted.`)) return;
        try {
            await API.delete(`/kanban/columns/${colId}`);
            showToast('Column deleted');
            await loadBoard();
        } catch (e) { showToast(e.message, 'error'); }
    }
    </script>
</body>
</html>
