<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>Gallery — ashcroft.cloud</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐢</text></svg>">
    <link rel="stylesheet" href="/app/css/shared.css?v=1775110247">
    <link rel="stylesheet" href="/app/css/gallery.css?v=1775110247">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="app-layout gallery-page">
        <div id="shell-sidebar"></div>
        <main class="main-content">
            <div id="shell-topbar"></div>
            <div class="content-area">
                <!-- Toolbar -->
                <div class="gallery-toolbar" id="toolbar">
                    <div class="search-wrapper">
                        <span class="search-icon"><i data-lucide="search" style="width:14px;height:14px"></i></span>
                        <input type="text" class="gallery-search" id="searchInput" placeholder="Search photos...">
                    </div>
                    <div class="toolbar-right">
                        <!-- fav filter available via search/collections -->
                        <button class="toolbar-btn" id="selectBtn" title="Select" style="display:none"><i data-lucide="check-square"></i></button>
                        <button class="toolbar-btn upload-btn" id="uploadBtn"><i data-lucide="upload"></i></button>
                        <div class="menu-wrapper">
                            <button class="toolbar-btn" id="moreBtn" title="More"><i data-lucide="more-horizontal"></i></button>
                            <div class="more-menu" id="moreMenu">
                                <button class="more-menu-item" data-view="timeline"><span><i data-lucide="calendar"></i></span> Timeline</button>
                                <button class="more-menu-item" data-view="grid"><span><i data-lucide="grid"></i></span> Grid</button>
                                <button class="more-menu-item" data-view="tags"><span><i data-lucide="tag"></i></span> Tags</button>
                                <button class="more-menu-item" data-view="map"><span><i data-lucide="map"></i></span> Map</button>
                                <button class="more-menu-item" data-view="stats"><span><i data-lucide="bar-chart-3"></i></span> Stats</button>
                                <div class="more-menu-divider"></div>
                                <button class="more-menu-item" id="albumsMenuBtn"><span><i data-lucide="folder"></i></span> Albums</button>
                                <button class="more-menu-item" id="colorMenuBtn"><span><i data-lucide="palette"></i></span> Color Filter</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Filter chips -->
                <div class="filter-bar" id="filterBar"></div>

                <!-- Color palette (hidden by default) -->
                <div class="color-bar" id="colorBar" style="display:none"></div>

                <!-- Collections -->
                <div class="collections-bar" id="collectionsBar" style="display:none"></div>

                <!-- Views -->
                <div id="gridView" class="photo-grid"></div>
                <div id="timelineView" class="timeline-view" style="display:none"></div>
                <div id="tagsView" class="tags-view" style="display:none"></div>
                <div id="mapView" class="map-view" style="display:none"><div id="photoMap"></div></div>
                <div id="statsView" class="stats-view" style="display:none"></div>
            </div>
            <div id="shell-bottom-nav"></div>
        </main>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-header">
            <span class="filename" id="lbFilename"></span>
            <div class="lightbox-actions">
                <button class="lightbox-btn" id="lbFav" title="Favorite (F)"><i data-lucide="heart"></i></button>
                <button class="lightbox-btn" id="lbSimilar" title="Find Similar"><i data-lucide="search"></i></button>
                <button class="lightbox-btn" id="lbDownload" title="Download"><i data-lucide="download"></i></button>
                <button class="lightbox-btn" id="lbInfo" title="Toggle info (I)"><i data-lucide="info"></i></button>
                <button class="lightbox-btn" id="lbClose" title="Close (Esc)"><i data-lucide="x"></i></button>
            </div>
        </div>
        <div class="lightbox-body" id="lbBody">
            <button class="lightbox-nav lightbox-prev" id="lbPrev">‹</button>
            <div class="lb-layer" id="lbLayerA"><img id="lbImgA" src="" alt=""></div>
            <div class="lb-layer" id="lbLayerB" style="visibility:hidden"><img id="lbImgB" src="" alt=""></div>
            <button class="lightbox-nav lightbox-next" id="lbNext">›</button>
        </div>
        <div class="lightbox-info-panel collapsed" id="lbInfoPanel">
            <div class="drag-handle" id="lbDragHandle"></div>
            <div class="ai-desc" id="lbDesc"></div>
            <div class="ai-tags" id="lbTags"></div>
            <div class="exif-grid" id="lbExif"></div>
            <div class="similar-row" id="lbSimilarRow" style="display:none">
                <h4>Similar Photos</h4>
                <div class="similar-photos" id="lbSimilarPhotos"></div>
            </div>
        </div>
    </div>

    <!-- Upload Overlay -->
    <div class="upload-overlay" id="uploadOverlay">
        <div class="upload-zone" id="uploadZone">
            <div class="icon"><i data-lucide="camera" style="width:48px;height:48px;stroke-width:1.5"></i></div>
            <h3>Drop photos here</h3>
            <p>or click to browse · JPEG, PNG, WebP</p>
            <input type="file" id="fileInput" multiple accept="image/*" style="display:none">
            <div class="upload-progress" id="uploadProgress"></div>
        </div>
    </div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" data-action="favorite"><span class="cm-icon"><i data-lucide="heart"></i></span> Toggle Favorite</div>
        <div class="context-menu-item" data-action="similar"><span class="cm-icon"><i data-lucide="search"></i></span> Find Similar</div>
        <div class="context-menu-item" data-action="download"><span class="cm-icon"><i data-lucide="download"></i></span> Download</div>
        <div class="context-menu-item" data-action="share"><span class="cm-icon"><i data-lucide="share-2"></i></span> Share</div>
        <div class="context-menu-sep"></div>
        <div class="context-menu-item danger" data-action="delete"><span class="cm-icon"><i data-lucide="trash-2"></i></span> Delete</div>
    </div>

    <!-- Albums Panel -->
    <div class="albums-panel" id="albumsPanel">
        <h2>Albums <button class="toolbar-btn" id="createAlbumBtn" style="font-size:12px;width:auto;padding:0 12px;">+ New</button></h2>
        <div id="albumsList"></div>
    </div>

    <!-- Batch bar -->
    <div class="batch-bar" id="batchBar">
        <span class="count"><span id="selectedCount">0</span> selected</span>
        <button class="batch-btn fav" id="batchFav"><i data-lucide="heart" style="width:14px;height:14px;vertical-align:-2px;margin-right:2px"></i> Favorite</button>
        <button class="batch-btn album" id="batchAlbum"><i data-lucide="folder" style="width:14px;height:14px;vertical-align:-2px;margin-right:2px"></i> Album</button>
        <button class="batch-btn del" id="batchDel"><i data-lucide="trash-2" style="width:14px;height:14px;vertical-align:-2px;margin-right:2px"></i> Delete</button>
        <button class="batch-btn" id="batchCancel" style="background:var(--surface2);color:var(--text)">Cancel</button>
    </div>

    <script src="/app/js/shared/api.js?v=1775110247"></script>
    <script src="/app/js/shared/auth.js?v=1775110247"></script>
    <script src="/app/js/shared/ui.js?v=1775110247"></script>
    <script src="/app/js/shared/components.js?v=1775110247"></script>
    <script src="/app/js/shared/nav.js?v=1775110247"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/app/js/gallery.js?v=1775110247"></script>
</body>
</html>
