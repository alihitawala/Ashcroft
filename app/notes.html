<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>Notes — ashcroft.cloud</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐢</text></svg>">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/app/manifest.json">
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#635BFF">
    
    <link rel="stylesheet" href="/app/css/shared.css?v=1771820559">
    <style>
        /* ─── Notes Page Styles ─── */
        .notes-layout {
            display: flex;
            gap: 0;
            height: calc(100vh - 60px);
            margin: -28px -32px;
        }

        /* ─── Sidebar (Note List) ─── */
        .notes-sidebar {
            width: 320px;
            flex-shrink: 0;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: var(--surface);
            overflow: hidden;
        }
        .notes-sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .notes-sidebar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .notes-sidebar-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }
        .notes-search {
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-size: 13px;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        .notes-search:focus { border-color: var(--accent); }
        .notes-search::placeholder { color: var(--text-tertiary); }

        .notes-sort {
            display: flex;
            gap: 4px;
            padding: 0 16px 8px;
        }
        .sort-btn {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            border: none;
            background: transparent;
            color: var(--text-tertiary);
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .sort-btn:hover { color: var(--text); background: var(--surface2); }
        .sort-btn.active { color: var(--accent); background: var(--accent-bg); }

        .notes-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .note-card {
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 4px;
            border: 1px solid transparent;
        }
        .note-card:hover { background: var(--surface2); }
        .note-card.active {
            background: var(--accent-bg);
            border-color: var(--accent-border);
        }
        .note-card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .note-card-title .pin-icon { font-size: 11px; flex-shrink: 0; }
        .note-card-preview {
            font-size: 12px;
            color: var(--text-tertiary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 4px;
        }
        .note-card-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-tertiary);
        }
        .note-card-meta .access-badge {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 4px;
        }
        .access-household {
            background: var(--blue-bg);
            color: var(--blue);
        }
        .access-admin {
            background: var(--red-bg);
            color: var(--red);
            font-weight: 600;
        }
        .note-card-meta .tag-chip {
            font-size: 10px;
            background: var(--surface3);
            padding: 1px 6px;
            border-radius: 4px;
        }

        .pinned-section-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-tertiary);
            padding: 8px 14px 4px;
            font-weight: 600;
        }

        /* ─── Note Editor ─── */
        .note-editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }
        .note-editor-empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .editor-toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            flex-wrap: wrap;
        }
        .toolbar-btn {
            width: 32px; height: 32px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            font-family: inherit;
        }
        .toolbar-btn:hover { background: var(--surface2); color: var(--text); }
        .toolbar-sep {
            width: 1px;
            height: 20px;
            background: var(--border);
            margin: 0 4px;
        }
        .save-indicator {
            margin-left: auto;
            font-size: 12px;
            color: var(--text-tertiary);
            font-weight: 500;
        }
        .save-indicator.saving { color: var(--amber); }
        .save-indicator.saved { color: var(--green); }

        .editor-title-input {
            border: none;
            background: transparent;
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            padding: 20px 24px 8px;
            outline: none;
            width: 100%;
            font-family: inherit;
            letter-spacing: -0.01em;
        }
        .editor-title-input::placeholder { color: var(--text-tertiary); }

        .editor-content {
            flex: 1;
            padding: 8px 24px 24px;
            overflow-y: auto;
        }
        .editor-content textarea {
            width: 100%;
            height: 100%;
            min-height: 200px;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 15px;
            line-height: 1.7;
            outline: none;
            resize: none;
            font-family: inherit;
        }
        .editor-content textarea::placeholder { color: var(--text-tertiary); }

        /* Tags */
        .editor-tags {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 24px 12px;
            flex-wrap: wrap;
        }
        .tag-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 6px;
            background: var(--accent-bg);
            color: var(--accent);
            font-size: 12px;
            font-weight: 500;
        }
        .tag-chip .tag-remove {
            cursor: pointer;
            font-size: 10px;
            opacity: 0.7;
            transition: opacity 0.15s;
        }
        .tag-chip .tag-remove:hover { opacity: 1; }
        .tag-add-input {
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 12px;
            outline: none;
            width: 80px;
            font-family: inherit;
        }
        .tag-add-input::placeholder { color: var(--text-tertiary); }

        /* Footer */
        .editor-footer {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            border-top: 1px solid var(--border);
            background: var(--surface);
            flex-wrap: wrap;
        }
        .footer-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            transition: all 0.15s;
            font-family: inherit;
        }
        .footer-toggle:hover { border-color: var(--accent); }
        .footer-toggle.active {
            background: var(--accent-bg);
            border-color: var(--accent-border);
            color: var(--accent);
        }
        .footer-select {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }
        .footer-spacer { flex: 1; }
        .delete-note-btn {
            font-size: 12px;
            color: var(--red);
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 6px;
            transition: all 0.15s;
            font-family: inherit;
        }
        .delete-note-btn:hover { background: var(--red-bg); }

        /* ─── Mobile ─── */
        .mobile-back-btn {
            display: none;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s;
            font-family: inherit;
        }
        .mobile-back-btn:hover { border-color: var(--accent); color: var(--accent); }

        @media (max-width: 768px) {
            .notes-layout { margin: -18px -16px; height: calc(100vh - 52px); }
            .notes-sidebar { width: 100%; }
            .note-editor { display: none; }
            .notes-layout.editor-open .notes-sidebar { display: none; }
            .notes-layout.editor-open .note-editor { display: flex; }
            .mobile-back-btn { display: inline-flex; }
            .editor-title-input { font-size: 20px; padding: 16px 16px 6px; }
            .editor-content { padding: 6px 16px 16px; }
            .editor-tags { padding: 0 16px 8px; }
        }
    </style>
</head>
<body>
    <div class="app-layout" id="appLayout"></div>

    <script src="/app/js/shared/api.js?v=1771820559"></script>
    <script src="/app/js/shared/auth.js?v=1771820559"></script>
    <script src="/app/js/shared/ui.js?v=1771820559"></script>
    <script src="/app/js/shared/components.js?v=1771820559"></script>
    <script src="/app/js/shared/nav.js?v=1771820559"></script>
    <script>
        // ─── State ───
        let notes = [];
        let activeNoteId = null;
        let searchQuery = '';
        let sortBy = 'updated';
        let saveTimer = null;
        let isSaving = false;

        // ─── Boot ───
        (async () => {
            try { await requireAuth(); } catch { return; }

            const shell = renderAppShell('Notes', 'notes');
            document.getElementById('appLayout').innerHTML = `
                ${shell.sidebar}
                ${shell.bottomNav}
                <div class="main-content">
                    ${shell.topbar}
                    <div class="main-body">
                        <div class="notes-layout" id="notesLayout">
                            <div class="notes-sidebar">
                                <div class="notes-sidebar-header">
                                    <div class="notes-sidebar-top">
                                        <span class="notes-sidebar-title">Notes</span>
                                        <button class="btn btn-primary" style="padding:6px 12px;font-size:12px" onclick="createNote()">＋ New</button>
                                    </div>
                                    <input class="notes-search" placeholder="Search notes..." oninput="searchQuery=this.value;renderNoteList()">
                                </div>
                                <div class="notes-sort">
                                    <button class="sort-btn active" data-sort="updated" onclick="setSort('updated',this)">Recent</button>
                                    <button class="sort-btn" data-sort="created" onclick="setSort('created',this)">Created</button>
                                    <button class="sort-btn" data-sort="title" onclick="setSort('title',this)">A-Z</button>
                                </div>
                                <div class="notes-list" id="notesList">
                                    <div class="skeleton skeleton-card" style="height:60px;margin-bottom:6px"></div>
                                    <div class="skeleton skeleton-card" style="height:60px;margin-bottom:6px"></div>
                                    <div class="skeleton skeleton-card" style="height:60px"></div>
                                </div>
                            </div>
                            <div class="note-editor" id="noteEditor">
                                <div class="note-editor-empty">
                                    <div class="empty-state">
                                        <div class="emoji"><i data-lucide="file-text"></i></div>
                                        <p>Select a note or create a new one</p>
                                        <button class="btn btn-secondary" onclick="createNote()">＋ New Note</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            initAppShell('notes');
            await loadNotes();
        })();

        // ─── Data ───
        async function loadNotes() {
            try {
                const data = await API.get('/notes');
                notes = Array.isArray(data) ? data : (data?.items || []);
                renderNoteList();
                if (activeNoteId) {
                    const note = notes.find(n => n.id === activeNoteId);
                    if (note) renderEditor(note);
                }
            } catch (err) {
                showToast('Failed to load notes', 'error');
            }
        }

        // ─── Note List ───
        function getFilteredNotes() {
            let filtered = [...notes];
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(n =>
                    (n.title || '').toLowerCase().includes(q) ||
                    (n.content || '').toLowerCase().includes(q)
                );
            }
            // Sort
            filtered.sort((a, b) => {
                if (sortBy === 'title') return (a.title || '').localeCompare(b.title || '');
                const da = new Date(sortBy === 'created' ? (a.created_at || 0) : (a.updated_at || a.created_at || 0));
                const db = new Date(sortBy === 'created' ? (b.created_at || 0) : (b.updated_at || b.created_at || 0));
                return db - da;
            });
            return filtered;
        }

        function renderNoteList() {
            const container = document.getElementById('notesList');
            const filtered = getFilteredNotes();

            if (filtered.length === 0 && notes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="padding:32px 16px">
                        <div class="emoji"><i data-lucide="file-text"></i></div>
                        <p>No notes yet — create one!</p>
                        <button class="btn btn-secondary" onclick="createNote()">＋ New Note</button>
                    </div>`;
                return;
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><p>No matching notes</p></div>`;
                return;
            }

            const pinned = filtered.filter(n => n.pinned);
            const unpinned = filtered.filter(n => !n.pinned);
            let html = '';

            if (pinned.length > 0) {
                html += `<div class="pinned-section-label"><i data-lucide="pin" style="width:10px;height:10px;vertical-align:-1px"></i> Pinned</div>`;
                html += pinned.map(n => renderNoteCard(n)).join('');
                if (unpinned.length > 0) {
                    html += `<div class="pinned-section-label" style="margin-top:8px">All Notes</div>`;
                }
            }
            html += unpinned.map(n => renderNoteCard(n)).join('');
            container.innerHTML = html;
            if (window.lucide) lucide.createIcons();
        }

        function renderNoteCard(note) {
            const preview = (note.content || '').replace(/<[^>]*>/g, '').substring(0, 100);
            const date = formatDate(note.updated_at || note.created_at || new Date().toISOString());
            const tags = (note.tags || []).slice(0, 2);
            return `
                <div class="note-card${note.id === activeNoteId ? ' active' : ''}" onclick="openNote(${note.id})">
                    <div class="note-card-title">
                        ${note.pinned ? '<span class="pin-icon"><i data-lucide="pin" style="width:11px;height:11px"></i></span>' : ''}
                        ${esc(note.title || 'Untitled')}
                    </div>
                    <div class="note-card-preview">${esc(preview) || 'Empty note'}</div>
                    <div class="note-card-meta">
                        <span>${date}</span>
                        ${note.access === 'household' ? '<span class="access-badge access-household"><i data-lucide="home" style="width:10px;height:10px;vertical-align:-1px"></i> Household</span>' : note.access === 'admin' ? '<span class="access-badge access-admin"><i data-lucide="shield" style="width:10px;height:10px;vertical-align:-1px"></i> Admin</span>' : ''}
                        ${tags.map(t => `<span class="tag-chip">${esc(t)}</span>`).join('')}
                    </div>
                </div>`;
        }

        function setSort(sort, btn) {
            sortBy = sort;
            document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderNoteList();
        }

        // ─── Open / Create Note ───
        function openNote(id) {
            activeNoteId = id;
            const note = notes.find(n => n.id === id);
            if (!note) return;
            renderNoteList();
            renderEditor(note);
            document.getElementById('notesLayout').classList.add('editor-open');
        }

        async function createNote() {
            try {
                const note = await API.post('/notes', { title: '', content: '', access: 'private', tags: [], pinned: false });
                notes.unshift(note);
                openNote(note.id);
                showToast('Note created ✓');
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function goBack() {
            document.getElementById('notesLayout').classList.remove('editor-open');
            activeNoteId = null;
            renderNoteList();
        }

        // ─── Editor ───
        function renderEditor(note) {
            const tags = note.tags || [];
            document.getElementById('noteEditor').innerHTML = `
                <div class="editor-toolbar">
                    <button class="mobile-back-btn" onclick="goBack()"><i data-lucide="arrow-left" style="width:14px;height:14px;vertical-align:-2px"></i> Back</button>
                    <button class="toolbar-btn" onclick="execCmd('bold')" title="Bold"><b>B</b></button>
                    <button class="toolbar-btn" onclick="execCmd('italic')" title="Italic"><i>I</i></button>
                    <button class="toolbar-btn" onclick="execCmd('insertUnorderedList')" title="Bullet list">•≡</button>
                    <span class="save-indicator" id="saveIndicator"></span>
                </div>
                <input class="editor-title-input" id="editorTitle" placeholder="Note title..."
                    value="${esc(note.title || '')}" oninput="onEditorChange()">
                <div class="editor-tags" id="editorTags">
                    ${tags.map(t => `<span class="tag-chip">${esc(t)} <span class="tag-remove" onclick="removeTag('${esc(t)}')"><i data-lucide="x" style="width:10px;height:10px"></i></span></span>`).join('')}
                    <input class="tag-add-input" placeholder="+ tag" onkeydown="if(event.key==='Enter'){addTag(this.value);this.value='';event.preventDefault()}">
                </div>
                <div class="editor-content">
                    <textarea id="editorContent" placeholder="Write something..."
                        oninput="onEditorChange()">${esc(note.content || '')}</textarea>
                </div>
                <div class="editor-footer">
                    <select class="footer-select" id="accessSelect" onchange="changeNoteAccess(this.value)">
                        <option value="private"${note.access === 'private' ? ' selected' : ''}>🔒 Private</option>
                        <option value="household"${note.access === 'household' ? ' selected' : ''}>🏠 Household</option>
                        ${currentUser?.role === 'admin' ? `<option value="admin"${note.access === 'admin' ? ' selected' : ''}>👑 Admin</option>` : ''}
                    </select>
                    <button class="footer-toggle${note.pinned ? ' active' : ''}" id="togglePinned" onclick="toggleNoteProp('pinned')">
                        <i data-lucide="pin" style="width:12px;height:12px;vertical-align:-2px"></i> Pinned
                    </button>
                    <span class="footer-spacer"></span>
                    <button class="delete-note-btn" onclick="deleteNote(${note.id})"><i data-lucide="trash-2" style="width:12px;height:12px;vertical-align:-2px"></i> Delete</button>
                </div>
            `;
            if (window.lucide) lucide.createIcons();
        }

        function execCmd(cmd) {
            // For textarea, we do simple wrapping
            const ta = document.getElementById('editorContent');
            if (!ta) return;
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            const selected = ta.value.substring(start, end);

            let prefix = '', suffix = '';
            if (cmd === 'bold') { prefix = '**'; suffix = '**'; }
            else if (cmd === 'italic') { prefix = '_'; suffix = '_'; }
            else if (cmd === 'insertUnorderedList') { prefix = '- '; }

            ta.value = ta.value.substring(0, start) + prefix + selected + suffix + ta.value.substring(end);
            ta.focus();
            ta.selectionStart = start + prefix.length;
            ta.selectionEnd = start + prefix.length + selected.length;
            onEditorChange();
        }

        function onEditorChange() {
            clearTimeout(saveTimer);
            setSaveIndicator('saving');
            saveTimer = setTimeout(() => autoSave(), 1000);
        }

        async function autoSave() {
            if (!activeNoteId) return;
            const note = notes.find(n => n.id === activeNoteId);
            if (!note) return;

            const title = document.getElementById('editorTitle')?.value || '';
            const content = document.getElementById('editorContent')?.value || '';

            note.title = title;
            note.content = content;
            renderNoteList(); // Update sidebar preview

            try {
                isSaving = true;
                await API.put(`/notes/${activeNoteId}`, { title, content });
                setSaveIndicator('saved');
            } catch (err) {
                setSaveIndicator('error');
                showToast('Failed to save', 'error');
            } finally {
                isSaving = false;
            }
        }

        function setSaveIndicator(state) {
            const el = document.getElementById('saveIndicator');
            if (!el) return;
            el.className = 'save-indicator';
            if (state === 'saving') { el.classList.add('saving'); el.textContent = 'Saving...'; }
            else if (state === 'saved') { el.classList.add('saved'); el.textContent = 'Saved ✓'; }
            else if (state === 'error') { el.textContent = 'Error!'; el.style.color = 'var(--red)'; }
            else { el.textContent = ''; }
        }

        // ─── Tags ───
        function addTag(tag) {
            tag = tag.trim();
            if (!tag || !activeNoteId) return;
            const note = notes.find(n => n.id === activeNoteId);
            if (!note) return;
            if (!note.tags) note.tags = [];
            if (note.tags.includes(tag)) return;
            note.tags.push(tag);
            renderEditor(note);
            API.put(`/notes/${activeNoteId}`, { tags: note.tags }).catch(() => showToast('Failed to save tag', 'error'));
        }

        function removeTag(tag) {
            if (!activeNoteId) return;
            const note = notes.find(n => n.id === activeNoteId);
            if (!note || !note.tags) return;
            note.tags = note.tags.filter(t => t !== tag);
            renderEditor(note);
            API.put(`/notes/${activeNoteId}`, { tags: note.tags }).catch(() => showToast('Failed to remove tag', 'error'));
        }

        // ─── Toggle Properties ───
        async function toggleNoteProp(prop) {
            if (!activeNoteId) return;
            const note = notes.find(n => n.id === activeNoteId);
            if (!note) return;
            note[prop] = !note[prop];
            renderEditor(note);
            renderNoteList();
            try {
                await API.put(`/notes/${activeNoteId}`, { [prop]: note[prop] });
            } catch (err) {
                note[prop] = !note[prop];
                renderEditor(note);
                showToast(err.message, 'error');
            }
        }

        async function changeNoteAccess(newAccess) {
            if (!activeNoteId) return;
            const note = notes.find(n => n.id === activeNoteId);
            if (!note) return;
            const oldAccess = note.access;
            note.access = newAccess;
            renderEditor(note);
            renderNoteList();
            try {
                await API.put(`/notes/${activeNoteId}`, { access: newAccess });
            } catch (err) {
                note.access = oldAccess;
                renderEditor(note);
                renderNoteList();
                showToast(err.message, 'error');
            }
        }

        // ─── Delete ───
        async function deleteNote(id) {
            if (!confirm('Delete this note?')) return;
            try {
                await API.delete(`/notes/${id}`);
                notes = notes.filter(n => n.id !== id);
                if (activeNoteId === id) {
                    activeNoteId = null;
                    document.getElementById('noteEditor').innerHTML = `
                        <div class="note-editor-empty">
                            <div class="empty-state">
                                <div class="emoji"><i data-lucide="file-text"></i></div>
                                <p>Select a note or create a new one</p>
                                <button class="btn btn-secondary" onclick="createNote()">＋ New Note</button>
                            </div>
                        </div>`;
                    document.getElementById('notesLayout').classList.remove('editor-open');
                }
                renderNoteList();
                showToast('Note deleted ✓');
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // ─── Helpers ───
        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s || '';
            return d.innerHTML;
        }
    </script>
</body>
</html>
