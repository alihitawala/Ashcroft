<head>
    <meta charset="UTF-8">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐢</text></svg>">
    <link rel="manifest" href="/app/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="stylesheet" href="/app/css/shared.css">
    <link rel="stylesheet" href="/app/css/travel.css?v=1775108685">
    <link rel="stylesheet" href="/app/css/leaflet/leaflet.css?v=1775108685">
    <style>
        /* Critical Leaflet overrides — ensures tiles render even if leaflet.css is cached stale */
        .leaflet-pane, .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow,
        .leaflet-tile-container, .leaflet-pane > svg, .leaflet-pane > canvas,
        .leaflet-zoom-box, .leaflet-image-layer, .leaflet-layer { position: absolute; left: 0; top: 0; }
        .leaflet-container { overflow: hidden; }
        .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow { user-select: none; -webkit-user-select: none; -webkit-user-drag: none; }
        .leaflet-tile { filter: inherit; visibility: hidden; }
        .leaflet-tile-loaded { visibility: inherit; }
        .leaflet-tile-pane { z-index: 200; }
        .leaflet-overlay-pane { z-index: 400; }
        .leaflet-marker-pane { z-index: 600; }
        .leaflet-tooltip-pane { z-index: 650; }
        .leaflet-popup-pane { z-index: 700; }
        .leaflet-container .leaflet-tile-pane img, .leaflet-container .leaflet-tile { max-width: none !important; max-height: none !important; }
        .leaflet-container img.leaflet-image-layer { max-width: none !important; }
    </style>
</head>
<body>
    <div class="app-layout" id="appLayout"></div>

    <script src="/app/js/shared/api.js"></script>
    <script src="/app/js/shared/auth.js"></script>

    <script src="/app/js/shared/components.js"></script>
    <script src="/app/js/shared/nav.js"></script>
    <script src="/app/js/leaflet.js"></script>
    <script src="/app/js/travel.js?v=1775108685"></script>
</body>
</html>
